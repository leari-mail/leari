name: Release

# Triggered by pushing a version tag, created with `pnpm release <bump>`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            /^## \[/ { printing = index($0, heading) == 1; next }
            printing
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ---

          **Installing:** download the `.dmg` (macOS, Apple Silicon and Intel) or the `-setup.exe` (Windows).
          Builds are not code-signed yet:
          - macOS: after moving leari to Applications, run `xattr -dr com.apple.quarantine /Applications/leari.app`
            (or allow it in System Settings → Privacy & Security).
          - Windows: in the SmartScreen prompt, choose "More info" → "Run anyway".
          NOTES
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=true
          # The create call returns the id directly (a draft has no tag yet, so it can't be looked up by tag).
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="leari $GITHUB_REF_NAME" \
            -F body=@notes.md \
            -F draft=true \
            -F prerelease="$prerelease" \
            --jq .id)
          test -n "$id" || { echo "::error::Could not create the release"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            runner: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Signs with a fixed self-signed "leari Release" certificate, so the app keeps the same
      # code identity across versions and macOS doesn't ask for Keychain access after updates.
      # (Not a Developer ID: Gatekeeper still shows "unidentified developer" on first launch.)
      # Without the secrets (e.g. forks), tauri.conf.json's ad-hoc signing is used.
      - name: Import macOS signing certificate
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured; using ad-hoc signing."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "APPLE_SIGNING_IDENTITY=leari Release" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # OAuth client ids baked into the build (see .env.example). Empty = sign-in disabled.
          LEARI_GOOGLE_CLIENT_ID: ${{ secrets.LEARI_GOOGLE_CLIENT_ID }}
          LEARI_GOOGLE_CLIENT_SECRET: ${{ secrets.LEARI_GOOGLE_CLIENT_SECRET }}
          LEARI_MICROSOFT_CLIENT_ID: ${{ secrets.LEARI_MICROSOFT_CLIENT_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
